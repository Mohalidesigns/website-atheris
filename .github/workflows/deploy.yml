# .github/workflows/deploy.yml

name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Build React frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # --- SSH into server and deploy ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/public_html

            # Discard the previous run's asset upload before pulling. The upload
            # step below overwrites manifest.json, which is tracked, so without
            # this reset the pull aborts on "local changes would be overwritten"
            # for any commit that touches it.
            git checkout -- public/build || true

            # Pull latest code
            git pull origin main

            # --- TEMPORARY composer probe ---
            # `composer install` has failed with "command not found" on every
            # deploy since at least 2026-10-05, silently: this script has no
            # `set -e`, so the step still reported success. Non-interactive SSH
            # shells get a minimal PATH, so locate composer before fixing the
            # call. Remove this block once the real path is known.
            echo "--- composer probe ---"
            echo "PATH: $PATH"
            echo "php (this shell): $(command -v php || echo MISSING)"
            echo "composer (this shell): $(command -v composer || echo MISSING)"
            echo "composer (login shell): $(bash -lc 'command -v composer' 2>/dev/null || echo MISSING)"
            for p in /opt/cpanel/composer/bin/composer /usr/local/bin/composer /usr/bin/composer "$HOME/bin/composer" "$HOME/composer.phar"; do
              if [ -e "$p" ]; then echo "found: $p"; else echo "absent: $p"; fi
            done
            echo "--- end probe ---"

            # Install/update PHP dependencies
            composer install --no-dev --optimize-autoloader

            # Run DB migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart queue workers if applicable
            php artisan queue:restart

            # Guarantee the upload target exists and log its absolute path, so a
            # failed upload can be diagnosed from the run log.
            mkdir -p public/build/assets
            echo "asset target: $(cd public/build && pwd)"

            echo "✅ Deployment complete"

      # --- Upload the freshly built assets ---
      # Must run AFTER the SSH step: git pull restores the tracked bundle, so
      # this upload is what actually serves. Ordering it last also means a
      # failure here degrades to the committed bundle rather than an unstyled
      # site. Both paths go up in one tar, so manifest.json and the hashed
      # assets it names are extracted together.
      - name: Upload built assets
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          # Paths are archived relative to the workspace and extracted into
          # target, so these land in ~/public_html/public/build/. Do NOT set
          # rm: true here -- target is the application root.
          source: "public/build/assets,public/build/manifest.json"
          target: "~/public_html"
          overwrite: true
